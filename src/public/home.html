<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IIR OCOMM" />
    <meta name="theme-color" content="#1a73e8" />
    <meta
      name="description"
      content="IIR OCOMM - 医药信息检索平台" />
    <link rel="icon" type="image/svg+xml" href="/common/images/favicon.ico" />
    <title>IIR OCOMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Roboto', 'Arial', sans-serif;
        background: #fff;
        color: #202124;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 800px;
        padding: 20px;
        text-align: center;
      }

      /* Logo和标题 */
      .header {
        margin-bottom: 48px;
      }

      .logo {
        font-size: 64px;
        font-weight: 300;
        color: #1a73e8;
        margin-bottom: 8px;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 14px;
        color: #5f6368;
        font-weight: 400;
      }

      /* 系统卡片 */
      .systems {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 40px;
      }

      .card {
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 32px 24px;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card:hover {
        box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.3), 0 4px 8px 3px rgba(60, 64, 67, 0.15);
        border-color: #1a73e8;
      }

      .card-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-icon svg {
        width: 48px;
        height: 48px;
        fill: #1a73e8;
      }

      .card-title {
        font-size: 18px;
        font-weight: 500;
        color: #202124;
        margin-bottom: 8px;
      }

      .card-desc {
        font-size: 13px;
        color: #5f6368;
        line-height: 1.5;
      }

      /* 页脚 */
      .footer {
        font-size: 12px;
        color: #5f6368;
      }

      /* 响应式 */
      @media (max-width: 768px) {
        body {
          height: auto;
          overflow: auto;
        }

        .container {
          padding: 40px 20px;
        }

        .header {
          margin-bottom: 32px;
        }

        .logo {
          font-size: 48px;
        }

        .systems {
          grid-template-columns: 1fr;
          gap: 16px;
          margin-bottom: 32px;
        }

        .card {
          padding: 24px 20px;
        }

        .card-icon {
          width: 48px;
          height: 48px;
        }

        .card-icon svg {
          width: 40px;
          height: 40px;
        }
      }

      @media (max-height: 700px) {
        .header {
          margin-bottom: 32px;
        }

        .logo {
          font-size: 48px;
        }

        .card {
          padding: 24px 20px;
        }

        .card-icon {
          width: 48px;
          height: 48px;
          margin-bottom: 12px;
        }

        .card-icon svg {
          width: 40px;
          height: 40px;
        }

        .systems {
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">IIR OCOMM</div>
        <div class="subtitle">医药信息检索平台</div>
      </div>

      <div class="systems">
        <a href="/fda" class="card" target="_blank" rel="noopener noreferrer">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
            </svg>
          </div>
          <div class="card-title">FDA 非活性成分</div>
          <div class="card-desc">156,000+ 条数据记录</div>
        </a>

        <a href="/handbook" class="card" target="_blank" rel="noopener noreferrer">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18,2H12V9L9.5,7.5L7,9V2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V4A2,2 0 0,0 18,2Z"/>
            </svg>
          </div>
          <div class="card-title">药用辅料手册</div>
          <div class="card-desc">300+ 份技术文档</div>
        </a>
      </div>

      <div class="footer">
        © 2025 IIR OCOMM
      </div>
    </div>
  </body>
</html>
