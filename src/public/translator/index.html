<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IIR OCOMM" />
    <meta name="theme-color" content="#1a73e8" />
    <meta
      name="description"
      content="PDF翻译器 - 基于pdf2zh-next的文档翻译工具" />
    <link rel="icon" type="image/svg+xml" href="/common/images/favicon.ico" />
    <title>PDF翻译器 - IIR OCOMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common/styles/main.css?v=1.1.2" />
  </head>
  <body>
    <!-- 全局导航栏 -->
    <nav class="main-nav">
      <div class="nav-container">
        <a href="/" class="nav-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 17H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          IIR OCOMM
        </a>
        <div class="nav-links">
          <a href="/" class="nav-link">首页</a>
          <a href="/fda" class="nav-link">FDA检索</a>
          <a href="/handbook" class="nav-link">辅料手册</a>
          <a href="/translator" class="nav-link active">PDF翻译</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <header>
        <div class="header-content">
          <div class="header-title">
            <h1>PDF 翻译器</h1>
            <p class="subtitle">基于 pdf2zh-next 的智能文档翻译工具</p>
          </div>
          <div class="user-info" id="userInfo" style="display: none;">
            <div class="user-welcome">
              <span class="welcome-text">欢迎, <strong id="userName"></strong></span>
            </div>
            <div class="user-actions">
              <span class="user-id">工号: <strong id="userEmployeeId"></strong></span>
              <button class="btn-logout" id="logoutBtn">登出</button>
            </div>
          </div>
        </div>
      </header>

      <!-- 文件上传区域 -->
      <div class="upload-section">
        <h2>选择文件</h2>
        <div class="upload-area" id="uploadArea">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="upload-text">拖拽PDF文件到这里 或 点击选择</div>
          <div class="upload-hint">支持多文件选择，每个文件将按顺序翻译</div>
        </div>
        <input type="file" id="fileInput" accept=".pdf" multiple style="display: none;" />

        <!-- 文件列表 -->
        <div class="file-list" id="fileList" style="display: none;">
          <div class="file-list-header">
            <span class="file-list-title">已选择 <span id="fileCount">0</span> 个文件</span>
            <div class="file-list-actions">
              <button class="btn-secondary btn-small" id="clearFilesBtn">清空</button>
              <button class="btn-primary btn-small" id="addMoreBtn">继续添加</button>
            </div>
          </div>
          <div id="fileItems"></div>
          <div class="translation-controls">
            <button class="btn-primary" id="startTranslationBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 3L19 12L5 21V3Z" fill="currentColor"/>
              </svg>
              开始翻译 (<span id="translateCount">0</span>个文件)
            </button>
          </div>
        </div>
      </div>

      <!-- 翻译进度 -->
      <div class="progress-section" id="progressSection">
        <div class="progress-header">
          <span class="progress-title">正在翻译...</span>
          <span class="progress-stats"><span id="progressCurrent">0</span> / <span id="progressTotal">0</span> 已完成</span>
        </div>
        <div class="progress-current">
          <div class="progress-current-label">当前文件:</div>
          <div class="progress-current-file" id="currentFile">-</div>
          <div class="progress-timer">
            <svg class="timer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            已耗时: <span id="elapsedTime">00:00:00</span>
          </div>
        </div>
        <button class="btn-secondary" id="cancelTranslationBtn">取消翻译</button>
      </div>

      <!-- 翻译历史 -->
      <div class="history-section">
        <div class="history-header">
          <h2>翻译历史 (共 <span id="historyCount">0</span> 条记录)</h2>
          <button class="btn-secondary btn-small" id="clearHistoryBtn">清空历史</button>
        </div>
        <div class="history-table-container">
          <table class="history-table" id="historyTable">
            <thead>
              <tr>
                <th>文件名</th>
                <th>翻译时间</th>
                <th>耗时</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <tr>
                <td colspan="5">
                  <div class="empty-history">
                    <svg class="empty-history-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p>暂无翻译记录</p>
                    <p style="font-size: 13px;">上传PDF文件开始翻译</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
