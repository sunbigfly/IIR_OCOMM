<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="值日提醒系统 - 智能值日管理工具" />
    <link rel="icon" type="image/svg+xml" href="/common/images/favicon.ico" />
    <title>值日提醒 - Pharma Toolbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common/styles/main.css?v=1.1.2" />
    <style>
      /* 配合全局flex布局：内容区域可滚动 */
      .dutyinfo-container {
        flex: 1 1 auto; /* 占据剩余空间 */
        overflow-y: auto; /* 允许滚动 */
        width: 100%;
        background: #f5f5f5;
        /* 隐藏滚动条 */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .dutyinfo-container::-webkit-scrollbar {
        display: none;
      }
      .dutyinfo-frame {
        border: none;
        width: 100%;
        height: 100vh; /* JS会补偿导航栏高度 */
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 全局导航栏 -->
    <nav class="main-nav">
      <div class="nav-container">
        <a href="/" class="nav-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 17H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Pharma Toolbox
        </a>
        <div class="nav-links">
          <a href="/" class="nav-link">首页</a>
          <a href="/fda" class="nav-link">FDA检索</a>
          <a href="/handbook" class="nav-link">辅料手册</a>
          <a href="/translator" class="nav-link">PDF翻译</a>
          <a href="/optimizer" class="nav-link">Prompt优化</a>
          <a href="/dutyinfo" class="nav-link active">值日提醒</a>
        </div>
      </div>
    </nav>

    <div class="dutyinfo-container">
      <iframe 
        class="dutyinfo-frame" 
        src="" 
        title="Duty Info System"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </div>

    <script>
      const iframe = document.querySelector('.dutyinfo-frame');
      const nav = document.querySelector('.main-nav');
      
      // 动态设置iframe的src，支持局域网访问
      const hostname = window.location.hostname;
      iframe.src = `http://${hostname}:7860`;
      
      // 动态调整iframe高度 = 窗口高度 + 导航栏高度（补偿被吃掉的部分）
      function adjustIframeHeight() {
        const windowHeight = window.innerHeight;
        const navHeight = nav.offsetHeight;
        const iframeHeight = windowHeight + navHeight;
        
        iframe.style.height = iframeHeight + 'px';
        console.log(`Iframe高度 = ${windowHeight}px + ${navHeight}px = ${iframeHeight}px`);
      }
      
      iframe.addEventListener('load', () => {
        console.log('Duty Info System loaded');
        adjustIframeHeight();
      });
      
      window.addEventListener('resize', adjustIframeHeight);
      document.addEventListener('DOMContentLoaded', adjustIframeHeight);
      
      iframe.addEventListener('error', () => {
        console.error('Failed to load Duty Info System');
        alert('无法加载值日提醒系统。\n\n请确保已经启动了dutyinfo服务：\ncd ~/tmpprj/dutyinfo/web_ui && python app.py');
      });
    </script>
  </body>
</html>
