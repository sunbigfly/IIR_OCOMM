<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="description" content="细胞库管理系统 - Cell Bank Management System" />
  <link rel="icon" type="image/svg+xml" href="/common/images/favicon.ico" />
  <title>细胞库管理 - Pharma Toolbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/common/styles/main.css?v=1.1.2" />
  <style>
    /* 配合全局flex布局：内容区域 */
    .cbms-container {
      flex: 1 1 auto;
      overflow: hidden;
      width: 100%;
      background: #f5f5f5;
      position: relative;
    }

    .cbms-frame {
      border: none;
      display: block;
      /* 90% 缩放效果 */
      transform: scale(0.9);
      transform-origin: top left;
      /* 补偿缩放后的尺寸：100% / 0.9 = 111.11% */
      width: 111.11%;
      height: 111.11%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <!-- 全局导航栏 -->
  <nav class="main-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 7H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M9 12H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M9 17H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        Pharma Toolbox
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">首页</a>
        <a href="/fda" class="nav-link">FDA检索</a>
        <a href="/handbook" class="nav-link">辅料手册</a>
        <a href="/translator" class="nav-link">PDF翻译</a>
        <a href="/optimizer" class="nav-link">Prompt优化</a>
        <a href="/dutyinfo" class="nav-link">值日提醒</a>
        <a href="/cbms" class="nav-link active">细胞库管理</a>
      </div>
    </div>
  </nav>

  <div class="cbms-container">
    <iframe class="cbms-frame" src="" title="Cell Bank Management System"
      allow="clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
    const iframe = document.querySelector('.cbms-frame');
    const nav = document.querySelector('.main-nav');

    // 动态设置iframe的src，支持局域网访问
    const hostname = window.location.hostname;
    iframe.src = `http://${hostname}:3000`;

    // 动态调整容器高度 = 窗口高度 - 导航栏高度
    const container = document.querySelector('.cbms-container');

    function adjustContainerHeight() {
      const windowHeight = window.innerHeight;
      const navHeight = nav.offsetHeight;
      const containerHeight = windowHeight - navHeight;

      container.style.height = containerHeight + 'px';
      console.log(`容器高度 = ${windowHeight}px - ${navHeight}px = ${containerHeight}px`);
    }

    iframe.addEventListener('load', () => {
      console.log('Cell Bank Management System loaded');
      adjustContainerHeight();
    });

    window.addEventListener('resize', adjustContainerHeight);
    document.addEventListener('DOMContentLoaded', adjustContainerHeight);

    iframe.addEventListener('error', () => {
      console.error('Failed to load Cell Bank Management System');
      alert('无法加载细胞库管理系统。\n\n请确保已经启动了cbms服务：\ncd ~/cbms && pnpm build && pnpm start');
    });
  </script>
</body>

</html>
